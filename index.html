<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小时工记账本</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 移动端响应式卡片布局 */
        @media (max-width: 767px) {
            .pc-table thead {
                display: none;
            }
            .pc-table tr {
                display: block;
                border: 1px solid #d1d5db;
                border-radius: 8px;
                margin-bottom: 12px;
                padding: 10px;
            }
            .pc-table td {
                display: inline-block;
                width: 48%;
                border: none !important;
                padding: 4px 0 !important;
                text-align: left !important;
            }
            .pc-table td::before {
                content: attr(data-label) "：";
                font-weight: 600;
                color: #374151;
            }
        }

        /* 隐藏时间选择器时钟图标，优化移动端样式 */
        input[type="time"]::-webkit-calendar-picker-indicator,
        input[type="date"]::-webkit-calendar-picker-indicator {
            opacity: 0;
            position: absolute;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .input-wrap {
            position: relative;
        }
        .input-wrap input {
            width: 100%;
            position: relative;
            z-index: 2;
            background: transparent;
        }
        /* 模拟placeholder提示文字（解决移动端date/time无placeholder） */
        .placeholder-tip {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            pointer-events: none;
            z-index: 1;
            transition: 0.2s;
        }
        .input-wrap input:not(:placeholder-shown) ~ .placeholder-tip {
            opacity: 0;
        }
    </style>
</head>
<body class="bg-gray-100 p-4 md:p-8 max-w-5xl mx-auto">
    <h1 class="text-3xl font-bold text-center mb-6">小时工记账表格</h1>

    <!-- 新增记录表单 -->
    <div class="bg-white rounded-lg shadow p-4 mb-6 grid grid-cols-1 md:grid-cols-4 gap-3">
        <div class="input-wrap border rounded px-3 py-2 overflow-hidden">
            <input type="date" id="workDate" required placeholder=" " />
            <span class="placeholder-tip">选择日期</span>
        </div>
        <div class="input-wrap border rounded px-3 py-2 overflow-hidden">
            <input type="time" id="startTime" value="08:00" placeholder=" " required>
            <span class="placeholder-tip">上班时间</span>
        </div>
        <div class="input-wrap border rounded px-3 py-2 overflow-hidden">
            <input type="time" id="endTime" list="endTimeList" placeholder=" " required>
            <span class="placeholder-tip">下班时间</span>
            <datalist id="endTimeList">
                <option value="17:00"></option>
                <option value="20:30"></option>
                <option value="21:30"></option>
            </datalist>
        </div>
        <input type="number" step="0.01" id="rewardPunish" placeholder="奖惩金额(默认0)" class="border rounded px-3 py-2">
        <button onclick="addRecord()" class="bg-blue-500 text-white rounded py-2 md:col-span-4 hover:bg-blue-600">添加记录</button>
    </div>

    <!-- 全局汇总【新增总加班时长】 -->
    <div class="bg-green-50 p-4 rounded-lg mb-4 flex gap-6 text-lg font-medium flex-wrap">
        <span>总有效工时：<span id="totalHour">0</span> h</span>
        <span>总加班时长：<span id="totalOvertime">0</span> h</span>
        <span>总收入：<span id="totalMoney">0</span> 元</span>
        <button onclick="exportCSV()" class="text-blue-600 underline">导出CSV</button>
        <button onclick="clearAllData()" class="text-red-600 underline">清空全部数据</button>
    </div>

    <!-- 月度统计区域【增加当月加班时长】 -->
    <div class="bg-amber-50 p-4 rounded-lg mb-6 flex flex-wrap items-center gap-3">
        <span class="font-medium">月度工资统计：</span>
        <select id="statYear" class="border rounded px-3 py-2"></select>
        <select id="statMonth" class="border rounded px-3 py-2"></select>
        <button onclick="calcMonthData()" class="bg-amber-500 text-white rounded px-4 py-2 hover:bg-amber-600">查询</button>
        <div id="monthResult" class="text-lg font-medium ml-2"></div>
    </div>

    <!-- 记账表格 -->
    <div class="bg-white shadow rounded-lg overflow-hidden">
        <table class="w-full pc-table">
            <thead class="bg-gray-200">
                <tr>
                    <th class="border p-2">日期</th>
                    <th class="border p-2">上班</th>
                    <th class="border p-2">下班</th>
                    <th class="border p-2">有效工时(h)</th>
                    <th class="border p-2">加班时长(h)</th>
                    <th class="border p-2">补贴(元)</th>
                    <th class="border p-2">奖惩(元)</th>
                    <th class="border p-2">当日总收入</th>
                    <th class="border p-2">操作</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
    </div>

<script>
// ========== 全局固定配置 ==========
const STORAGE_KEY = "hour_worker_records";
const HOURLY_WAGE = 16.5;
const OVERTIME_BASE = "17:30"; // 17点30分后算加班
let recordList = [];

window.onload = function(){
    loadData();
    renderTable();
    calcSummary();
    initMonthSelector();
}

// 读取本地存储
function loadData(){
    const str = localStorage.getItem(STORAGE_KEY);
    recordList = str ? JSON.parse(str) : [];
}

// 保存数据
function saveData(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(recordList));
}

/**
 * 时间字符串转总分钟数 "HH:MM" => number
 */
function timeToMin(timeStr) {
    const [h, m] = timeStr.split(":").map(Number);
    return h * 60 + m;
}

/**
 * 根据下班时间获取休息时长、补贴
 */
function getRuleConfig(endStr){
    if(endStr === "17:00"){
        return {breakHour: 1.0, subsidy: 12};
    }else{
        return {breakHour: 1.5, subsidy: 24};
    }
}

/**
 * 计算有效工时
 */
function calcValidWorkHour(startStr, endStr, breakHour) {
    const startMin = timeToMin(startStr);
    const endMin = timeToMin(endStr);
    const totalHour = (endMin - startMin) / 60;
    const validHour = Math.max(totalHour - breakHour, 0);
    return parseFloat(validHour.toFixed(2));
}

/**
 * 计算加班时长：下班超过17:30，超出部分为加班
 */
function calcOvertime(endStr){
    const limitMin = timeToMin(OVERTIME_BASE);
    const endMin = timeToMin(endStr);
    const overtimeMin = Math.max(endMin - limitMin, 0);
    return parseFloat((overtimeMin / 60).toFixed(2));
}

// 添加记账记录
function addRecord(){
    const date = document.getElementById("workDate").value;
    const startTime = document.getElementById("startTime").value;
    const endTime = document.getElementById("endTime").value;
    let rewardPunish = parseFloat(document.getElementById("rewardPunish").value) || 0;

    if(!date || !startTime || !endTime){
        alert("日期、上班时间、下班时间必须填写！");
        return;
    }

    const {breakHour, subsidy} = getRuleConfig(endTime);
    const validHours = calcValidWorkHour(startTime, endTime, breakHour);
    const overtimeHour = calcOvertime(endTime);
    const baseIncome = validHours * HOURLY_WAGE + subsidy;
    const totalIncome = baseIncome + rewardPunish;

    const item = {
        id: Date.now(),
        date,
        startTime,
        endTime,
        validHours,
        overtimeHour,
        subsidy,
        rewardPunish,
        income: totalIncome
    };

    // 同一天自动覆盖旧记录
    const existIndex = recordList.findIndex(r => r.date === date);
    if(existIndex >= 0){
        recordList[existIndex] = item;
    }else{
        recordList.unshift(item);
    }

    saveData();
    renderTable();
    calcSummary();
    initMonthSelector();

    // 清空输入项（上班时间保留默认08:00）
    document.getElementById("workDate").value = "";
    document.getElementById("endTime").value = "";
    document.getElementById("rewardPunish").value = "";
}

// 删除单条记录
function deleteRecord(id){
    recordList = recordList.filter(item => item.id !== id);
    saveData();
    renderTable();
    calcSummary();
    initMonthSelector();
}

// 渲染表格
function renderTable(){
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";
    recordList.forEach(item => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td class="border p-2 text-center" data-label="日期">${item.date}</td>
            <td class="border p-2 text-center" data-label="上班">${item.startTime}</td>
            <td class="border p-2 text-center" data-label="下班">${item.endTime}</td>
            <td class="border p-2 text-center" data-label="有效工时">${item.validHours}</td>
            <td class="border p-2 text-center text-orange-600 font-medium" data-label="加班时长">${item.overtimeHour}</td>
            <td class="border p-2 text-center" data-label="补贴">${item.subsidy}</td>
            <td class="border p-2 text-center" data-label="奖惩">${item.rewardPunish.toFixed(2)}</td>
            <td class="border p-2 text-center font-semibold text-red-600" data-label="当日总收入">${item.income.toFixed(2)}</td>
            <td class="border p-2 text-center" data-label="操作">
                <button onclick="deleteRecord(${item.id})" class="text-red-600">删除</button>
            </td>
        `;
        tbody.appendChild(tr);
    })
}

// 全局汇总统计工时、加班、总收入
function calcSummary(){
    let totalH = 0;
    let totalOT = 0;
    let totalM = 0;
    recordList.forEach(i=>{
        totalH += i.validHours;
        totalOT += i.overtimeHour;
        totalM += i.income;
    })
    document.getElementById("totalHour").innerText = totalH.toFixed(1);
    document.getElementById("totalOvertime").innerText = totalOT.toFixed(1);
    document.getElementById("totalMoney").innerText = totalM.toFixed(2);
}

// 初始化年月下拉选项
function initMonthSelector(){
    const yearSelect = document.getElementById("statYear");
    const monthSelect = document.getElementById("statMonth");
    yearSelect.innerHTML = "";
    monthSelect.innerHTML = "";

    const yearSet = new Set();
    recordList.forEach(item=>{
        const year = item.date.split("-")[0];
        yearSet.add(year);
    });
    const nowYear = new Date().getFullYear().toString();
    yearSet.add(nowYear);

    Array.from(yearSet).sort((a,b)=>b-a).forEach(y=>{
        yearSelect.innerHTML += `<option value="${y}">${y}年</option>`;
    });

    for(let m=1;m<=12;m++){
        monthSelect.innerHTML += `<option value="${String(m).padStart(2,'0')}">${m}月</option>`;
    }
}

// 按月统计计算（增加当月加班时长）
function calcMonthData(){
    const selectYear = document.getElementById("statYear").value;
    const selectMonth = document.getElementById("statMonth").value;
    const resultDom = document.getElementById("monthResult");

    const monthRecords = recordList.filter(item=>{
        const [y,m] = item.date.split("-");
        return y === selectYear && m === selectMonth;
    });

    let monthHour = 0;
    let monthOT = 0;
    let monthMoney = 0;
    monthRecords.forEach(r=>{
        monthHour += r.validHours;
        monthOT += r.overtimeHour;
        monthMoney += r.income;
    });

    resultDom.innerHTML =
        `【${selectYear}年${selectMonth}月】有效工时：${monthHour.toFixed(1)}h，加班时长：<span class="text-orange-600">${monthOT.toFixed(1)}h</span>，当月总收入：<span class="text-red-600">${monthMoney.toFixed(2)} 元</span>`;
}

// 导出CSV文件（新增加班列）
function exportCSV(){
    if(recordList.length === 0){
        alert("暂无数据");
        return;
    }
    let csv = "日期,上班时间,下班时间,有效工时,加班时长,补贴,奖惩金额,当日总收入\n";
    recordList.forEach(item=>{
        csv += `${item.date},${item.startTime},${item.endTime},${item.validHours},${item.overtimeHour},${item.subsidy},${item.rewardPunish.toFixed(2)},${item.income.toFixed(2)}\n`
    })
    const blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "小时工记账.csv";
    a.click();
}

// 清空全部数据
function clearAllData(){
    if(confirm("确定清空所有记录，无法恢复！")){
        recordList = [];
        saveData();
        renderTable();
        calcSummary();
        initMonthSelector();
        document.getElementById("monthResult").innerHTML = "";
    }
}
</script>
</body>
</html>
